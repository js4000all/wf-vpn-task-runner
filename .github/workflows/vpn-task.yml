name: VPN task

on:
  workflow_call:
    inputs:
      entrypoint:
        type: string
        required: true
      input-artifact-name:
        type: string
        required: false
        default: ''
      output-artifact-name:
        type: string
        required: false
        default: vpn-task
      retention-days:
        type: number
        required: false
        default: 0

jobs:
  run-with-vpn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install VPN packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            strongswan \
            strongswan-starter \
            xl2tpd \
            ppp \
            iproute2 \
            iputils-ping

      - name: Set runtime environment
        run: |
          echo "VPN_INPUT_ARTIFACT_DIR=${RUNNER_TEMP}/vpn-task-input-artifacts" >> "$GITHUB_ENV"
          echo "VPN_OUTPUT_ARTIFACT_DIR=${RUNNER_TEMP}/vpn-task-output-artifacts" >> "$GITHUB_ENV"

      - name: Prepare artifact directory
        run: |
          mkdir -p "${VPN_INPUT_ARTIFACT_DIR}"
          mkdir -p "${VPN_OUTPUT_ARTIFACT_DIR}"

      - name: Download input artifact
        if: inputs.input-artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.input-artifact-name }}
          path: ${{ env.VPN_INPUT_ARTIFACT_DIR }}

      - name: Run in VPN context
        env:
          VPN_ENTRYPOINT_SCRIPT: ${{ inputs.entrypoint }}

          # Required variables
          VPN_SERVER_IP: ${{ vars.VPN_SERVER_IP }}
          VPN_USERNAME: ${{ vars.VPN_USERNAME }}
          VPN_REMOTE_NETWORKS: ${{ vars.VPN_REMOTE_NETWORKS }}
          VPN_CHECK_HOST_IP: ${{ vars.VPN_CHECK_HOST_IP }}

          # VPN implementation overrides
          VPN_CONNECTION_NAME: ${{ vars.VPN_CONNECTION_NAME }}
          VPN_IKE_VERSION: ${{ vars.VPN_IKE_VERSION }}
          VPN_IKE_PROPOSAL: ${{ vars.VPN_IKE_PROPOSAL }}
          VPN_ESP_PROPOSAL: ${{ vars.VPN_ESP_PROPOSAL }}
          VPN_IKE_LIFETIME: ${{ vars.VPN_IKE_LIFETIME }}
          VPN_L2TP_PORT: ${{ vars.VPN_L2TP_PORT }}
          VPN_PPP_MTU: ${{ vars.VPN_PPP_MTU }}
          VPN_PPP_MRU: ${{ vars.VPN_PPP_MRU }}
          VPN_PPP_INTERFACE: ${{ vars.VPN_PPP_INTERFACE }}

          # Operational overrides
          VPN_IPSEC_START_DELAY_SEC: ${{ vars.VPN_IPSEC_START_DELAY_SEC }}
          VPN_L2TP_START_DELAY_SEC: ${{ vars.VPN_L2TP_START_DELAY_SEC }}
          VPN_CONNECT_TIMEOUT_SEC: ${{ vars.VPN_CONNECT_TIMEOUT_SEC }}
          VPN_PING_TIMEOUT_SEC: ${{ vars.VPN_PING_TIMEOUT_SEC }}
          VPN_DISCONNECT_TIMEOUT_SEC: ${{ vars.VPN_DISCONNECT_TIMEOUT_SEC }}

          # Secrets
          VPN_PSK: ${{ secrets.VPN_PSK }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}

        run: |
          .github/scripts/with-vpn.sh -- .github/scripts/vpn-entrypoint.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.output-artifact-name }}
          path: ${{ env.VPN_OUTPUT_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
